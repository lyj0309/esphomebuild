name: ESPHome Build One
on:
  workflow_dispatch:
    inputs:
      device:
        description: Device YAML basename
        required: true
        type: string
      bundle_encrypted:
        description: AES-256-GCM authenticated configuration bundle
        required: true
        type: string
      request_id:
        description: Unique build request identifier
        required: true
        type: string
run-name: ESPHome ${{ inputs.device }} (${{ inputs.request_id }})
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install encryption dependency
        run: |
          python3 -m venv "$RUNNER_TEMP/build-crypto"
          "$RUNNER_TEMP/build-crypto/bin/pip" install cryptography==46.0.3
      - name: Compile encrypted configuration
        env:
          ESPHOME_BUILD_KEY: ${{ secrets.ESPHOME_BUILD_KEY }}
          ESPHOME_SECRETS_YAML: ${{ secrets.ESPHOME_SECRETS_YAML }}
        run: '"$RUNNER_TEMP/build-crypto/bin/python" secure_runner.py'
      - name: Upload encrypted firmware and diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: esphome-${{ inputs.device }}-encrypted
          path: ${{ runner.temp }}/encrypted-output/build.enc
          if-no-files-found: error
          retention-days: 7
