name: ESPHome Build One

on:
  workflow_dispatch:
    inputs:
      device:
        description: YAML basename without .yaml (for example living-room)
        required: true
        type: string
      config_repo:
        description: Optional repository containing the ESPHome tree
        required: false
        default: ''
        type: string
      config_ref:
        description: Git ref in config_repo
        required: false
        default: master
        type: string
      config_b64:
        description: Optional base64 YAML overlay sent by the Dashboard
        required: false
        default: ''
        type: string
      request_id:
        description: Correlation id from the wrapper
        required: false
        default: manual
        type: string

run-name: ESPHome ${{ inputs.device }} (${{ inputs.request_id }})

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ inputs.device }}
      ESPHOME_SECRETS_YAML: ${{ secrets.ESPHOME_SECRETS_YAML }}
    steps:
      - name: Check out configuration
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config_repo || github.repository }}
          ref: ${{ inputs.config_ref }}
          token: ${{ secrets.CONFIG_REPO_TOKEN || github.token }}
          path: config-src

      - name: Prepare configuration
        shell: bash
        env:
          CONFIG_B64: ${{ inputs.config_b64 }}
        run: |
          set -euo pipefail
          shopt -s dotglob
          cp -a config-src/. .
          [[ "$DEVICE" =~ ^[A-Za-z0-9][A-Za-z0-9_-]*$ ]]
          if [[ -n "${CONFIG_B64:-}" ]]; then
            printf '%s' "$CONFIG_B64" | base64 --decode > "$DEVICE.yaml"
          fi
          test -s "$DEVICE.yaml"

      - name: Prepare secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${ESPHOME_SECRETS_YAML:-}" ]]; then
            printf '%s\n' "$ESPHOME_SECRETS_YAML" > secrets.yaml
          else
            python3 - <<'PY'
          import base64, re, secrets
          from pathlib import Path
          names = set()
          for path in Path('.').rglob('*.yaml'):
              names.update(re.findall(r'!secret\s+([A-Za-z0-9_]+)', path.read_text()))
          with Path('secrets.yaml').open('w') as out:
              for name in sorted(names):
                  value = base64.b64encode(secrets.token_bytes(32)).decode() if name.endswith('_api_key') else 'ci-build-only-' + secrets.token_hex(8)
                  out.write(f'{name}: "{value}"\n')
          PY
          fi

      - name: Compile
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/config" ghcr.io/esphome/esphome:2026.7.4 compile "/config/$DEVICE.yaml"

      - name: Stage firmware artifact
        run: |
          set -euo pipefail
          sudo chmod -R a+rX .esphome
          echo 'Build files:'
          find .esphome/build/${DEVICE} -type f -printf '%p %s bytes\n' | head -80 || true
          echo 'StorageJSON:'
          sed -n '1,80p' .esphome/storage/${DEVICE}.yaml.json || true
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          device = "${{ inputs.device }}"
          root = Path('.esphome')
          build = root / 'build' / device
          out = Path('artifact')
          (out / 'build' / device).mkdir(parents=True, exist_ok=True)
          (out / 'idedata').mkdir(parents=True, exist_ok=True)
          (out / 'storage').mkdir(parents=True, exist_ok=True)
          # PlatformIO may expose .pioenvs as a symlink. Walk links and stage
          # the flash images flat so upload-artifact never drops them.
          import os
          for parent, dirs, files in os.walk(build, followlinks=True):
              for name in files:
                  if not ((name.startswith('firmware') and name.endswith('.bin')) or name in {'bootloader.bin','partition-table.bin','ota_data_initial.bin'}):
                      continue
                  p = Path(parent) / name
                  dest = out / 'build' / device / name
                  dest.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(p, dest)
          idedata = next(build.rglob('idedata.json'), None)
          if idedata:
              shutil.copy2(idedata, out / 'idedata' / f'{device}.json')
          storage = root / 'storage' / f'{device}.yaml.json'
          if storage.exists():
              data = json.loads(storage.read_text())
              fw = data.get('firmware_bin_path')
              if fw:
                  p = Path(fw)
                  if str(p).startswith('/config/'):
                      p = Path(str(p)[len('/config/'):])
                  if p.exists() and p.suffix == '.bin':
                      shutil.copy2(p, out / 'build' / device / p.name)
              (out / 'storage' / storage.name).write_text(json.dumps(data, indent=2) + '\n')
          validated = root / 'storage' / f'{device}.yaml.validated.yaml'
          if validated.exists():
              shutil.copy2(validated, out / 'storage' / validated.name)
          if not any((out / 'build' / device).rglob('*.bin')):
              raise SystemExit('no firmware images found')
          if not (out / 'idedata' / f'{device}.json').exists():
              raise SystemExit('idedata.json not found')
          if not (out / 'storage' / f'{device}.yaml.json').exists():
              raise SystemExit('StorageJSON not found')
          PY

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esphome-${{ inputs.device }}
          path: artifact
          if-no-files-found: error
          retention-days: 30
